[package]
name = "fluss-lake"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
description = "Engine-neutral bounded lake and log read kernel for Apache Fluss"
homepage = { workspace = true }
repository = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }

[features]
integration_tests = ["fluss/integration_tests"]
# Paimon lake reading. Pinned to the official Apache release that contains
# apache/paimon-rust#374 (required for PK dedup semantics).
# Parquet is the only supported lake data file format for now.
paimon = ["dep:paimon", "dep:serde_json"]
# Merging a primary-key bucket from its kv snapshot instead of the lake.
kv-snapshot = ["fluss/kv-snapshot"]

[dependencies]
arrow = { workspace = true }
fluss = { package = "fluss-rs", path = "../fluss" }
futures = "0.3"
# The tail overlay's map: its default hasher is several times faster than std's SipHash on short keys.
hashbrown = "0.16"
paimon = { version = "0.3.0", default-features = false, features = ["storage-memory", "storage-fs", "storage-oss", "storage-s3"], optional = true }
serde_json = { workspace = true, optional = true }
thiserror = "1.0"
# Only the `time` machinery is used (idle-timeout enforcement); the Fluss
# client already requires a Tokio runtime, so this adds no new constraint.
tokio = { workspace = true }

[dev-dependencies]
fluss-test-cluster = { path = "../fluss-test-cluster" }
serde_json = { workspace = true }
tokio = { workspace = true }
