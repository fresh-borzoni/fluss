[package]
name = "fluss-native-ffi"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
description = "C ABI over fluss-rs and fluss-lake for engines that read Fluss natively"
homepage = { workspace = true }
repository = { workspace = true }
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
arrow = { workspace = true }
fluss = { package = "fluss-rs", path = "../fluss", features = ["storage-s3", "storage-oss"] }
fluss-lake = { path = "../fluss-lake", features = ["paimon", "kv-snapshot"] }
futures = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
